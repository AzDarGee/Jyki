default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &primary_development
    <<: *default
#    url: <%#= Rails.application.credentials.dig(:database, :dev, :url) %>
    host: <%= Rails.application.credentials.dig(:database, :dev, :host) %>
    port: <%= Rails.application.credentials.dig(:database, :dev, :port) || 5432 %>
    username: <%= Rails.application.credentials.dig(:database, :dev, :username) %>
    password: <%= Rails.application.credentials.dig(:database, :dev, :password) %>
    database: <%= Rails.application.credentials.dig(:database, :dev, :database) %>
#    database: jyki_development
    sslmode: require
  cache:
    <<: *primary_development
#    database: jyki_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
#    database: jyki_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
#    database: jyki_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: jyki_test
  queue:
    <<: *default
#    database: jyki_test_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
#    database: jyki_test_cache
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
#    database: jyki_test_cable
    migrations_paths: db/cable_migrate

production:
  primary: &primary_production
    <<: *default
    host: <%= Rails.application.credentials.dig(:database, :prod_local_supabase, :host) %>
    port: <%= Rails.application.credentials.dig(:database, :prod_local_supabase, :port) %>
    username: <%= Rails.application.credentials.dig(:database, :prod_local_supabase, :username) %>
    database: <%= Rails.application.credentials.dig(:database, :prod_local_supabase, :database) %>
#    url: <%#= Rails.application.credentials.dig(:database, :prod_local_supabase, :url) %>
    password: <%= Rails.application.credentials.dig(:database, :prod_local_supabase, :password) %>
    sslmode: require
  cache:
    <<: *primary_production
#    database: jyki_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
#    database: jyki_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
#    database: jyki_production_cable
    migrations_paths: db/cable_migrate
